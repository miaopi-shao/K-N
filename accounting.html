<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="acc-title">記帳系統</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="accounting-styles.css">
</head>
<body>

<div id="sidebarContainer"></div>

<div class="container">
    <div class="header-section">
        <h2 data-i18n="etf-title">ETF 月月配組合領息試算</h2>
        <div class="version-info">版本: 1.4 (Structure Standardized)</div>
    </div>
    
    <div class="config-section">
        <label data-i18n="etf-target-income">每月目標領息金額：</label>
        <input type="number" id="targetIncome" value="40000" style="width: 120px;" oninput="calculate()"> 元
        <span style="margin-left: 15px;" data-i18n="etf-target-note">(目標是讓 1~12 月每個月都盡量達到此金額)</span>
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button class="btn btn-add" onclick="addRow()" data-i18n="etf-add">+ 新增 ETF 標的</button>
        <button class="btn btn-add" style="background-color: #34a853;" onclick="saveBackup()" data-i18n="etf-backup">💾 保存備份</button>
    </div>

    <details style="margin-bottom: 20px; padding: 15px; background: var(--bg-tertiary); border-radius: 8px; border: 1px solid var(--border-primary);">
        <summary style="cursor: pointer; font-weight: bold; color: var(--text-accent);" data-i18n="etf-my-backup">📋 我的備份 (點擊展開)</summary>
        <div id="backupList" style="margin-top: 15px;"></div>
    </details>

    <table id="etfTable">
        <thead>
            <tr>
                <th width="15%" data-i18n="etf-name">ETF 名稱</th>
                <th width="12%" data-i18n="etf-dividend">單次配息(元/張)</th>
                <th width="12%" data-i18n="etf-price">參考股價(元)</th>
                <th width="25%" data-i18n="etf-months">配息月份 (點選切換)</th>
                <th width="12%" data-i18n="etf-shares">需持有張數</th>
                <th width="12%" data-i18n="etf-cost">投入本金</th>
                <th width="10%" data-i18n="etf-operation">操作</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <h3 data-i18n="etf-summary">每月領息總覽</h3>
    <div class="result-grid" id="monthGrid"></div>

    <div class="summary-bar">
        <div><span data-i18n="etf-total-capital">預估總投入本金：</span><span id="totalCapital" class="highlight">0</span> 萬元</div>
        <div><span data-i18n="etf-avg-monthly">平均月領金額：</span><span id="avgMonthly" class="highlight">0</span> 元</div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="accounting-script.js"></script>

</body>
</html>
