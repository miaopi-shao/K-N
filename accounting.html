<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="acc-title">記帳系統</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="accounting-styles.css">
</head>
<body>

<div id="sidebarContainer"></div>

<div class="container">
    <div class="header-section">
        <h2 data-i18n="acc-header">💰 記帳系統</h2>
        <div class="version-info">版本: 1.1 (Standardized)</div>
    </div>

    <div class="tab-container">
        <div class="tab-item" onclick="showPage('month')">
            <span class="tab-icon">📅</span>
            <span data-i18n="acc-tab-month">月明細</span>
        </div>
        <div class="tab-item" onclick="showPage('day')">
            <span class="tab-icon">📝</span>
            <span data-i18n="acc-tab-add">新增記錄</span>
        </div>
        <div class="tab-item" onclick="showPage('year')">
            <span class="tab-icon">📊</span>
            <span data-i18n="acc-tab-year">年統計</span>
        </div>
        <div class="tab-item" onclick="showPage('template')">
            <span class="tab-icon">🎯</span>
            <span data-i18n="acc-tab-tpl">範本設定</span>
        </div>
    </div>

    <div class="summary-card">
        <div class="summary-item">
            <span class="summary-label" data-i18n="acc-balance">本期盈餘</span>
            <div id="balanceDisplay" class="balance">0</div>
        </div>
        <div class="summary-item">
            <span class="summary-label" data-i18n="acc-income">收入</span>
            <div id="incomeDisplay" class="amount income-text">0</div>
        </div>
        <div class="summary-item">
            <span class="summary-label" data-i18n="acc-expense">支出</span>
            <div id="expenseDisplay" class="amount expense-text">0</div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 data-i18n="acc-edit-title">修改帳務</h3>
            <div class="modal-buttons">
                <button class="btn btn-success" onclick="updateRecord()" data-i18n="acc-save">儲存修改</button>
                <button class="btn btn-danger" onclick="deleteCurrentRecord()" data-i18n="acc-delete">刪除此筆</button>
                <button class="btn btn-secondary" onclick="closeModal()" data-i18n="acc-cancel">取消</button>
            </div>
        </div>
    </div>

    <div id="page-month" class="page">
        <div class="filter-section">
            <input type="month" id="monthFilter" onchange="render()" class="month-input">
            <button class="btn btn-primary" onclick="generateFromTemplate()" data-i18n="acc-btn-tpl-gen">🚀 一鍵生成本月帳務</button>
        </div>
        <div id="monthList" class="records-list"></div>
    </div>

    <div id="page-day" class="page hidden">
        <div class="form-section">
            <h3 data-i18n="acc-add-title">新增紀錄</h3>
            <div class="form-group">
                <label data-i18n="acc-category">分類：</label>
                <select id="typeInput" class="form-input">
                    <option value="臨時新增" data-i18n="cat-temp">臨時新增</option>
                    <option value="外送薪水" data-i18n="cat-delivery">外送薪水</option>
                    <option value="日薪" data-i18n="cat-daily">日薪</option>
                    <option value="食物" data-i18n="cat-food">食物</option>
                    <option value="交通" data-i18n="cat-trans">交通</option>
                </select>
            </div>
            <button class="btn btn-success" onclick="saveRecord()" data-i18n="acc-btn-add">✓ 確認加入</button>
        </div>
    </div>

    </div>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="accounting-script.js"></script>

</body>
</html>
