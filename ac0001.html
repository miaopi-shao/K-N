<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>財務管理系統 V7.1</title>
    <style>
        :root { --income-bg: #d4edda; --expense-bg: #f8d7da; --green-text: #28a745; --red-text: #dc3545; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: #f4f4f4; }
        .tab-container { display: flex; justify-content: space-around; background: #333; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .tab { color: #aaa; cursor: pointer; padding: 5px 10px; font-weight: bold; font-size: 0.9rem; }
        .tab.active { color: white; border-bottom: 2px solid white; }
        .summary-card { background: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 15px; border: 2px solid #333; }
        .balance { font-size: 2.2rem; font-weight: bold; margin-top: 10px; }
        .form-group { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1.1rem; box-sizing: border-box; }
        button { background: #333; color: white; border: none; font-weight: bold; cursor: pointer; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 8px; border-radius: 8px; border-left: 6px solid #333; }
        .income { background: var(--income-bg); border-color: var(--green-text); }
        .expense { background: var(--expense-bg); border-color: var(--red-text); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; }
        .hidden { display: none; }
        .template-item { background: #eee; padding: 10px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
        .del-btn { width: auto; padding: 5px 10px; margin: 0; background: #dc3545; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="tab-container">
    <div class="tab" onclick="showPage('year')">年總覽</div>
    <div class="tab active" onclick="showPage('month')">月明細</div>
    <div class="tab" onclick="showPage('day')">日流水</div>
    <div class="tab" onclick="showPage('template')">範本設定</div>
</div>

<div class="summary-card">
    <h2 id="summaryTitle" style="margin:0; font-size:1.1rem;">盈餘統計</h2>
    <div id="balanceDisplay" class="balance">0</div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>修改帳務</h3>
        <input type="hidden" id="editId">
        <label>日期：</label><input type="date" id="editDate">
        <label>項目：</label><input type="text" id="editItem">
        <label>金額：</label><input type="number" id="editAmount">
        <label>備註：</label><input type="text" id="editNote">
        <button onclick="updateRecord()" style="background: #28a745;">儲存修改</button>
        <button onclick="deleteCurrentRecord()" style="background: #dc3545;">刪除此筆</button>
        <button onclick="closeModal()" style="background: #999;">取消</button>
    </div>
</div>

<div id="page-template" class="page hidden">
    <div class="form-group">
        <h3>設定預設範本</h3>
        <label>週期：</label>
        <select id="tplMonth">
            <option value="all">每月重複</option>
            <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option>
            <option value="04">4月</option><option value="05">5月</option><option value="06">6月</option>
            <option value="07">7月</option><option value="08">8月</option><option value="09">9月</option>
            <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
        </select>
        <label>日期 (1~31)：</label>
        <input type="number" id="tplDay" value="1" min="1" max="31">
        <input type="text" id="tplItem" placeholder="項目名稱">
        <input type="number" id="tplAmount" placeholder="金額">
        <select id="tplType">
            <option value="預設支出">預設支出</option>
            <option value="外送薪水">外送薪水</option>
            <option value="股息收入">股息收入</option>
            <option value="稅務相關">稅務相關</option>
        </select>
        <input type="text" id="tplNote" placeholder="備註">
        <button onclick="saveTemplate()" style="background: #28a745;">加入範本</button>
        <hr>
        <div id="templateList"></div>
    </div>
</div>

<div id="page-day" class="page hidden">
    <div class="form-group">
        <h3>新增紀錄</h3>
        <input type="date" id="dateInput" style="height: 60px;">
        <input type="text" id="itemInput" placeholder="項目名稱">
        <input type="number" id="amountInput" placeholder="金額">
        <select id="typeInput">
            <option value="臨時新增">臨時新增</option>
            <option value="外送薪水">外送薪水</option>
            <option value="日薪">日薪</option>
        </select>
        <input type="text" id="noteInput" placeholder="備註">
        <button onclick="saveRecord()">確認加入</button>
    </div>
</div>

<div id="page-month" class="page">
    <div style="background: #e9ecef; padding: 15px; border-radius: 10px; margin-bottom: 15px; text-align: center;">
        <input type="month" id="monthFilter" onchange="render()" style="width: 60%; margin: 0;">
        <button onclick="generateFromTemplate()" style="background: #007bff; margin-top: 10px;">一鍵生成本月帳務</button>
    </div>
    <div id="monthList"></div>
</div>

<div id="page-year" class="page hidden">
    <div class="form-group">
        <select id="yearFilter" onchange="renderYearly()"></select>
    </div>
    <table style="width:100%; border-collapse: collapse; background:white;" border="1">
        <thead><tr style="background:#eee;"><th>月</th><th>收</th><th>支</th><th>盈</th></tr></thead>
        <tbody id="yearTableBody" style="text-align:center;"></tbody>
    </table>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('my_finances')) || [];
    let templates = JSON.parse(localStorage.getItem('my_templates')) || [];

    function renderTemplates() {
        const list = document.getElementById('templateList');
        list.innerHTML = '<h4>範本清單：</h4>';
        templates.forEach(t => {
            // 修正顯示邏輯：若欄位不存在，給予預設值防止顯示 NaN 或 undefined
            const mText = (t.month === 'all' || !t.month) ? '每月' : `${parseInt(t.month)}月`;
            const dText = t.day || '1';
            list.innerHTML += `<div class="template-item">
                <span><b>${mText}${dText}號</b> - ${t.item} (${t.amount})</span>
                <button class="del-btn" onclick="deleteTemplate(${t.id})">刪除</button>
            </div>`;
        });
    }

    function saveTemplate() {
        const day = parseInt(document.getElementById('tplDay').value) || 1;
        const tpl = {
            id: Date.now(),
            month: document.getElementById('tplMonth').value,
            day: day,
            item: document.getElementById('tplItem').value || "未命名",
            amount: parseFloat(document.getElementById('tplAmount').value) || 0,
            type: document.getElementById('tplType').value,
            note: document.getElementById('tplNote').value
        };
        templates.push(tpl);
        localStorage.setItem('my_templates', JSON.stringify(templates));
        renderTemplates();
    }

    function deleteTemplate(id) {
        templates = templates.filter(t => t.id !== id);
        localStorage.setItem('my_templates', JSON.stringify(templates));
        renderTemplates();
    }

    function generateFromTemplate() {
        const targetMonthVal = document.getElementById('monthFilter').value;
        const currentM = targetMonthVal.split('-')[1];
        if(confirm(`確定要生成嗎？`)) {
            templates.forEach(t => {
                const tMonth = t.month || 'all';
                const tDay = t.day || 1;
                if(tMonth === 'all' || tMonth === currentM) {
                    records.push({
                        id: Date.now() + Math.random(),
                        date: `${targetMonthVal}-${String(tDay).padStart(2, '0')}`,
                        item: t.item,
                        amount: t.amount,
                        type: t.type,
                        note: t.note
                    });
                }
            });
            sync(); render();
        }
    }

    // 通用邏輯
    function sync() { localStorage.setItem('my_finances', JSON.stringify(records)); }
    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
    function saveRecord() {
        const record = { id: Date.now(), date: document.getElementById('dateInput').value, item: document.getElementById('itemInput').value, amount: parseFloat(document.getElementById('amountInput').value) || 0, type: document.getElementById('typeInput').value, note: document.getElementById('noteInput').value };
        records.push(record); sync(); showPage('month');
    }
    function openEdit(id) {
        const r = records.find(item => item.id === id);
        document.getElementById('editId').value = r.id; document.getElementById('editDate').value = r.date;
        document.getElementById('editItem').value = r.item; document.getElementById('editAmount').value = r.amount;
        document.getElementById('editNote').value = r.note; document.getElementById('editModal').style.display = 'flex';
    }
    function updateRecord() {
        const id = parseFloat(document.getElementById('editId').value);
        const idx = records.findIndex(r => r.id === id);
        records[idx].date = document.getElementById('editDate').value;
        records[idx].item = document.getElementById('editItem').value;
        records[idx].amount = parseFloat(document.getElementById('editAmount').value);
        records[idx].note = document.getElementById('editNote').value;
        sync(); closeModal(); render();
    }
    function deleteCurrentRecord() {
        const id = parseFloat(document.getElementById('editId').value);
        records = records.filter(r => r.id !== id); sync(); closeModal(); render();
    }
    function render() {
        const list = document.getElementById('monthList');
        const filter = document.getElementById('monthFilter').value;
        let net = 0; list.innerHTML = '';
        records.filter(r => r.date.startsWith(filter)).sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(r => {
            net += r.amount;
            const div = document.createElement('div');
            div.className = `record-item ${r.amount >= 0 ? 'income' : 'expense'}`;
            div.innerHTML = `<div><b>${r.date.slice(5)} ${r.item}</b><br><small>${r.amount} | ${r.note}</small></div>
                             <button onclick="openEdit(${r.id})" style="width:auto;padding:5px 10px;font-size:0.8rem;">修改</button>`;
            list.appendChild(div);
        });
        document.getElementById('balanceDisplay').innerText = net.toLocaleString();
        document.getElementById('balanceDisplay').style.color = net >= 0 ? 'green' : 'red';
    }
    function showPage(p) {
        document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
        document.getElementById('page-' + p).classList.remove('hidden');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(p==='year') renderYearly(); else if(p==='month') render(); else if(p==='template') renderTemplates();
    }
    function renderYearly() {
        const tbody = document.getElementById('yearTableBody'); tbody.innerHTML = '';
        const years = [...new Set(records.map(r => r.date.slice(0, 4)))];
        const filter = document.getElementById('yearFilter');
        if(filter.innerHTML==='') years.sort().reverse().forEach(y => filter.innerHTML += `<option value="${y}">${y}年</option>`);
        const selYear = filter.value || new Date().getFullYear();
        for(let i=12; i>=1; i--) {
            const m = selYear + "-" + String(i).padStart(2, '0');
            const mData = records.filter(r => r.date.startsWith(m)); if(mData.length === 0) continue;
            const inc = mData.filter(r => r.amount > 0).reduce((a, b) => a + b.amount, 0);
            const exp = mData.filter(r => r.amount < 0).reduce((a, b) => a + Math.abs(b.amount), 0);
            tbody.innerHTML += `<tr><td>${i}月</td><td>${inc}</td><td>${exp}</td><td><b>${inc-exp}</b></td></tr>`;
        }
    }
    document.getElementById('monthFilter').value = new Date().toISOString().slice(0, 7);
    render();
</script>
</body>
</html>
