<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="car-title">車輛保養管理系統</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="car-styles.css">
</head>
<body>

<div id="sidebarContainer"></div>

<div class="container">
    <div class="header-section">
        <h2 data-i18n="car-title">🚗 車輛保養紀錄</h2>
        <div class="version-info">版本: 1.1 (AI-Optimized)</div>
    </div>

    <div class="summary-card">
        <div class="summary-item">
            <span class="summary-label" data-i18n="car-total-mileage">目前總里程</span>
            <div class="balance" id="displayTotalMileage">0 km</div>
        </div>
        <div class="summary-item">
            <span class="summary-label" data-i18n="car-remaining">下次保養倒數</span>
            <div class="balance" id="displayRemainingKm">-- km</div>
        </div>
        <div class="summary-item">
            <span class="summary-label" data-i18n="car-month-cost">本月保養支出</span>
            <div class="amount expense-text" id="displayMonthCost">$0</div>
        </div>
    </div>

    <div class="form-section">
        <h3 data-i18n="car-add-title">📝 新增保養項目</h3>
        <div class="form-group">
            <label data-i18n="car-date">保養日期：</label>
            <input type="date" id="inputDate" class="form-input" required>
        </div>
        <div class="form-group">
            <label data-i18n="car-mileage">儀表里程 (km)：</label>
            <input type="number" id="inputMileage" class="form-input" data-i18n="car-mileage-placeholder" placeholder="輸入目前里程數">
        </div>
        <div class="form-group">
            <label data-i18n="car-item">維修項目：</label>
            <input type="text" id="inputItem" class="form-input" data-i18n="car-item-placeholder" placeholder="如：換機油、齒輪油">
        </div>
        <div class="form-group">
            <label data-i18n="car-fee">費用 (NTD)：</label>
            <input type="number" id="inputCost" class="form-input" data-i18n="car-fee-placeholder" placeholder="輸入支出金額">
        </div>
        <button class="btn btn-success" onclick="addRecord()" data-i18n="car-save">✓ 儲存紀錄</button>
    </div>

    <h3 data-i18n="car-records">📋 保養紀錄</h3>
    <div id="recordList" class="records-list"></div>
</div>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="car-script.js"></script>

</body>
</html>
