<style>

        position: fixed;
        left: 0;

        width: 220px;
        height: 100vh;

        border-right: 1px solid var(--border-primary);
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 8px var(--shadow-primary);
        z-index: 500;
        overflow-y: auto;

    }

    .sidebar.collapsed {
        width: 60px;
    }

    .sidebar-header {
        padding: 15px;
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--border-primary);
        flex-shrink: 0;
    }

    .sidebar-home-btn,
    .sidebar-toggle-btn,
    .sidebar-settings-btn {
        background: var(--btn-primary);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 1.1em;
        transition: all 0.3s ease;
        flex: 1;
    }

    .sidebar-home-btn:hover,
    .sidebar-toggle-btn:hover,
    .sidebar-settings-btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
    }

    .sidebar-section {
        padding: 20px 15px;
        border-bottom: 1px solid var(--border-primary);
        flex-shrink: 0;
    }

    .sidebar.collapsed .sidebar-section {
        padding: 15px 8px;
    }

    .sidebar-section-title {
        font-weight: bold;
        color: var(--text-accent);
        margin-bottom: 12px;
        font-size: 0.9em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidebar-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .sidebar-link {
        display: block;
        padding: 10px 12px;
        background: var(--bg-tertiary);
        color: var(--text-primary);
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.9em;
        transition: all 0.3s ease;
        border: 1px solid transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidebar-link:hover {
        background: var(--text-accent);
        color: white;
        transform: translateX(4px);
    }

    .sidebar-link.active {
        background: #34a853;
        color: white;
        font-weight: bold;
    }

    .sidebar-footer {
        margin-top: auto;
        padding: 15px;
        text-align: center;
        font-size: 0.8em;
        color: var(--text-secondary);
        border-top: 1px solid var(--border-primary);
        flex-shrink: 0;
    }

    .sidebar.collapsed .sidebar-section-title,
    .sidebar.collapsed .sidebar-link {
        text-align: center;
        padding: 8px 4px;
        font-size: 0.8em;
    }

    .sidebar.collapsed .sidebar-section {

    }

    /* 響應式設計 */
    @media (max-width: 768px) {
        .sidebar {
            width: 180px;
        }

        .sidebar.collapsed {
            width: 50px;
        }

        .sidebar-link {
            font-size: 0.85em;
            padding: 8px 10px;
        }
    }

    @media (max-width: 480px) {
        .sidebar {
            position: fixed;
            left: -220px;
            width: 220px;
        }

        .sidebar.mobile-open {
            left: 0;
        }

        .sidebar.collapsed {
            left: -60px;
            width: 60px;
        }

        .sidebar.collapsed.mobile-open {
            left: 0;
            width: 60px;
        }
    }
</style>

<script>
    // 側邊欄控制函數
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('collapsed');
        document.body.classList.toggle('sidebar-collapsed');
        localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
    }

    function goHome() {
        window.location.href = 'welcome.html';
    }

    function setActiveLink(event) {
        document.querySelectorAll('.sidebar-link').forEach(link => {
            link.classList.remove('active');
        });
        if (event.target.classList.contains('sidebar-link')) {
            event.target.classList.add('active');
        }
    }

    // 初始化側邊欄狀態
    window.addEventListener('DOMContentLoaded', () => {
        const isSidebarCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
        if (isSidebarCollapsed) {
            document.getElementById('sidebar').classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
        }

        const currentPage = window.location.pathname.split('/').pop() || 'home.html';
        document.querySelectorAll('.sidebar-link').forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            }
        });

        if (window.innerWidth < 480) {
            document.addEventListener('click', (e) => {
                const sidebar = document.getElementById('sidebar');
                const isClickInsideSidebar = sidebar.contains(e.target);
                const isToggleBtn = e.target.closest('.sidebar-toggle-btn');
                
                if (!isClickInsideSidebar && !isToggleBtn && sidebar.classList.contains('mobile-open')) {
                    sidebar.classList.remove('mobile-open');
                }
            });
        }
    });
</script>
