<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="etf-title">ETF 月月配組合領息試算</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="etf-logic.css">
</head>
<body>

<div id="sidebarContainer"></div>

<div class="container">
    <div class="header-section">
        <h2 data-i18n="etf-title">ETF 月月配組合領息試算</h2>
        <div class="version-info">版本: 1.5 (Standardized Core)</div>
    </div>

    <div class="config-section" style="padding: 15px; background: var(--bg-tertiary); border-radius: 8px; margin-bottom: 20px;">
        <label data-i18n="etf-target-income">每月目標領息金額：</label>
        <input type="number" id="targetIncome" value="40000" oninput="calculate()" class="form-input" style="width: 120px;"> 元
        <span class="hint" data-i18n="etf-target-note" style="margin-left: 10px; color: #666;">(目標是讓 1~12 月每個月都盡量達到此金額)</span>
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button class="btn btn-success" onclick="addRow()" data-i18n="etf-add">+ 新增 ETF 標的</button>
        <button class="btn btn-primary" onclick="saveBackupPrompt()" data-i18n="etf-backup">💾 保存備份</button>
    </div>

    <details class="backup-details" style="margin-bottom: 20px;">
        <summary data-i18n="etf-my-backup" style="cursor: pointer; font-weight: bold;">📋 我的備份 (點擊展開)</summary>
        <div id="backupList" style="padding: 10px 0;"></div>
    </details>

    <div class="table-container">
        <table id="etfTable">
            <thead>
                <tr>
                    <th data-i18n="etf-name">ETF 名稱</th>
                    <th data-i18n="etf-dividend">單次配息(元/張)</th>
                    <th data-i18n="etf-price">參考股價(元)</th>
                    <th data-i18n="etf-months">配息月份 (點選切換)</th>
                    <th data-i18n="etf-shares">需持有張數</th>
                    <th data-i18n="etf-cost">投入本金</th>
                    <th data-i18n="etf-operation">操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h3 data-i18n="etf-summary" style="margin-top: 25px;">每月領息總覽</h3>
    <div class="result-grid" id="monthGrid"></div>

    <div class="summary-card" style="margin-top: 20px; display: flex; justify-content: space-around; background: #2c3e50; color: white; padding: 20px; border-radius: 8px;">
        <div class="summary-item">
            <span data-i18n="etf-total-capital">預估總投入本金：</span>
            <span id="totalCapital" class="highlight" style="color: #f1c40f; font-size: 1.4rem; font-weight: bold;">0</span> 萬
        </div>
        <div class="summary-item">
            <span data-i18n="etf-avg-monthly">平均月領金額：</span>
            <span id="avgMonthly" class="highlight" style="color: #f1c40f; font-size: 1.4rem; font-weight: bold;">0</span> 元
        </div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="etf-logic.js"></script>

</body>
</html>
