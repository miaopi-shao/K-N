<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 月月配精算器</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="etf-logic.css">
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>ETF 月月配組合試算</h2>
        <div class="version-info">Ver 1.5</div>
    </div>
    
    <div class="config-section">
        <label>每月目標領息：</label>
        <input type="number" id="targetIncome" value="40000" oninput="calculate()"> 元
    </div>

    <div style="margin-bottom: 15px; display: flex; gap: 10px;">
        <button class="btn btn-add" onclick="addRow()">+ 新增</button>
        <button class="btn btn-save" onclick="saveBackupPrompt()">💾 備份</button>
    </div>

    <table id="etfTable">
        <thead>
            <tr>
                <th>名稱</th>
                <th>配息/張</th>
                <th>股價</th>
                <th>配息月份</th>
                <th>張數</th>
                <th>本金</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="result-grid" id="monthGrid"></div>

    <div class="summary-bar">
        <div>總本金：<span id="totalCapital" class="highlight">0</span> 萬</div>
        <div>均月領：<span id="avgMonthly" class="highlight">0</span> 元</div>
    </div>
</div>

<script src="i18n.js"></script>
<script src="script.js"></script>
<script src="etf-logic.js"></script>
</body>
</html>
