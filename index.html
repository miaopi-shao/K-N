<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF 月月配組合精算器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="切換主題">🌙</button>

<div class="container">
    <h2>ETF 月月配組合領息試算</h2>
    
    <div class="config-section">
        <label>每月目標領息金額：</label>
        <input type="number" id="targetIncome" value="40000" style="width: 120px;" oninput="calculate()"> 元
        <span style="margin-left: 15px; color: #666;">(目標是讓 1~12 月每個月都盡量達到此金額)</span>
    </div>

    <button class="btn btn-add" onclick="addRow()">+ 新增 ETF 標的</button>

    <table id="etfTable">
        <thead>
            <tr>
                <th width="15%">ETF 名稱</th>
                <th width="12%">單次配息(元/張)</th>
                <th width="12%">參考股價(元)</th>
                <th width="25%">配息月份 (點選切換)</th>
                <th width="12%">需持有張數</th>
                <th width="12%">投入本金</th>
                <th width="10%">操作</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text" value="0056" class="name"></td>
                <td><input type="number" value="866" class="dividend" oninput="calculate()"></td>
                <td><input type="number" value="37" class="price" oninput="calculate()"></td>
                <td>
                    <div class="month-box">
                        <div class="month-item active" onclick="toggleMonth(this)">1</div><div class="month-item" onclick="toggleMonth(this)">2</div><div class="month-item" onclick="toggleMonth(this)">3</div>
                        <div class="month-item active" onclick="toggleMonth(this)">4</div><div class="month-item" onclick="toggleMonth(this)">5</div><div class="month-item" onclick="toggleMonth(this)">6</div>
                        <div class="month-item active" onclick="toggleMonth(this)">7</div><div class="month-item" onclick="toggleMonth(this)">8</div><div class="month-item" onclick="toggleMonth(this)">9</div>
                        <div class="month-item active" onclick="toggleMonth(this)">10</div><div class="month-item" onclick="toggleMonth(this)">11</div><div class="month-item" onclick="toggleMonth(this)">12</div>
                    </div>
                </td>
                <td class="shares">0</td>
                <td class="cost">0</td>
                <td><button class="btn btn-del" onclick="deleteRow(this)">刪除</button></td>
            </tr>
        </tbody>
    </table>

    <h3>每月領息總覽</h3>
    <div class="result-grid" id="monthGrid">
        </div>

    <div class="summary-bar">
        <div>預估總投入本金：<span id="totalCapital" class="highlight">0</span> 萬元</div>
        <div>平均月領金額：<span id="avgMonthly" class="highlight">0</span> 元</div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
